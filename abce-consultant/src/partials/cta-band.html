  <section class="section cta-band" aria-labelledby="cta-h">

      <div class="cta-band__inner split">
        <div data-reveal>
          <span class="datum" aria-hidden="true"></span>
          <h2 id="cta-h">{{ c.cta_title }}</h2>
          <p class="lede">{{ c.cta_lede }}</p>
        </div>
        <div class="cluster cta-band__actions" data-reveal>

        </div>
      </div>
    </div>
  </section>
