  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.metaTitle }}</title>
  <meta name="description" content="{{ page.description }}">
  <link rel="canonical" href="{{ page.canonical }}">
<!--@if page.noindex -->
  <meta name="robots" content="noindex, follow">
<!--@endif -->

  <meta name="theme-color" content="#0B2545">
  <meta name="author" content="{{ site.name }}">
  <meta name="format-detection" content="telephone=yes">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.name }}">
  <meta property="og:locale" content="en">
  <meta property="og:title" content="{{ page.metaTitle }}">
  <meta property="og:description" content="{{ page.description }}">
  <meta property="og:url" content="{{ page.canonical }}">
  <meta property="og:image" content="{{ page.ogImage }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{ site.name }} — {{ site.positioning }}">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.metaTitle }}">
  <meta name="twitter:description" content="{{ page.description }}">
  <meta name="twitter:image" content="{{ page.ogImage }}">

  <!-- Icons -->
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/icon-512.png" sizes="512x512" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">

  <!-- Self-hosted type: no third-party font request, no layout shift on swap -->
  <link rel="preload" href="/assets/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/sora-latin-var.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="/src/css/main.css">

  <!-- Runs before first paint. Without this, elements with a resting
       transform would render visible and then jump, so the reveal states are
       only ever applied when JS is available AND motion is permitted. -->
  <script>
    (function () {
      var h = document.documentElement;
      h.classList.add('js');
      try {
        if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          h.classList.add('js-motion');
        }
      } catch (e) { /* no matchMedia: leave content in its final state */ }
    })();
  </script>

  <script type="module" src="/src/js/main.js"></script>

  <!-- Site-wide organisation data. Only facts supplied by the company. -->

    "email": "{{ site.email }}",
    "telephone": ["+258842395576", "+258856992494"],
    "address": {

      "streetAddress": "Rua Alberto Cassimo, N.º 60, COOP",
      "addressLocality": "Maputo City",
      "addressCountry": "MZ"
    },
    "areaServed": "Worldwide",

    ]
  }
  </script>
